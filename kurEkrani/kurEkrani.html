<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Document</title>
    
</head>
<style>
    .container {
    display: grid;
    margin: 300px auto;  
    grid-template-columns: 1fr;
    
    background: #222222;
    color: #fff;
    padding: 25px;
    font-family: sans-serif;
    width: 180px;
    height: 90px;  
    text-align: center;
}
span{
    color: #5a5959;
    font-size: small;
}

</style>
<body>
    <div class="container">
    <div><span>$</span> 1324 <span>26</span></div>
    <div>USD <span>EUR BTC ETH</span> <i class="fa-solid fa-ellipsis-vertical fa-rotate-90" style="color: #363636;"></i></div>
</div>

</body>
</html>
